[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "luca"
version = "0.1.0"
description = "Synthetic organism reasoning benchmark for LLM agents"
readme = "README.md"
authors = [
    { name = "Anna Gogleva" },
    { name = "Thomas Charman" },
    { name = "Martin Balla" },
    { name = "Karl Gemayel" },
]
requires-python = ">=3.10"
license = "CC-BY-NC-4.0"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.30.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "networkx>=3.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/RelationRx/luca"
Repository = "https://github.com/RelationRx/luca"
Issues = "https://github.com/RelationRx/luca/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
stats = [
    "statsmodels>=0.14",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
include = ["luca*"]

[tool.ruff]
line-length = 100
